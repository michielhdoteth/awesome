on:
  pull_request:
    branches: [main]
    paths:
      - 'readme.md'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: awesome-lint
        run: ./.github/workflows/repo_linter.sh